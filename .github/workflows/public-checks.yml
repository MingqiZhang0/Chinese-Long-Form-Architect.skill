name: Public Skill checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Syntax and manifest checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -c "import ast; from pathlib import Path; [ast.parse(p.read_text(encoding='utf-8')) for p in Path('scripts').glob('*.py')]"
          python -B scripts/audit_skill_structure.py .
          python -B scripts/test_public_release.py
      - name: Curated public Fast checks (synthetic fixtures)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B scripts/test_public_fast.py
